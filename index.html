<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var origFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var currentFetch = origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore if already configured
        }
      })();
    </script>
    <title>Калькулятор послуг та заявок</title>
    <meta name="description" content="Інтерактивний калькулятор пакетних та поштучних діджитал-послуг з автоматичним формуванням та збереженням заявок у Google Таблиці" />
    <meta property="og:title" content="Калькулятор послуг та заявок" />
    <meta property="og:description" content="Інтерактивний калькулятор пакетних та поштучних діджитал-послуг з автоматичним формуванням та збереженням заявок у Google Таблиці" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
